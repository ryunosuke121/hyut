name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン番号（例: 1.1.0）"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest
    environment: main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Bump version
        id: version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "バージョンは 1.2.3 の形式で指定してください" >&2
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "タグ v${VERSION} は既に存在します" >&2
            exit 1
          fi

          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

          sed -i '' "0,/^version = /s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

          (cd src-tauri && cargo check --quiet)

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get DMG path
        if: steps.check.outputs.exists == 'false'
        id: dmg
        run: |
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          DMG_NAME=$(basename "$DMG_PATH")
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
          make_latest: true

      - name: Update Homebrew Tap
        if: steps.check.outputs.exists == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${{ steps.dmg.outputs.name }}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG_NAME}"
          SHA256=$(shasum -a 256 "${{ steps.dmg.outputs.path }}" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ryunosuke121/homebrew-tap.git" tap
          cd tap

          mkdir -p Casks
          cat > Casks/hyut.rb <<FORMULA
          cask "hyut" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${DMG_URL}"
            name "hyut"
            desc "Quick memo app for macOS"
            homepage "https://github.com/ryunosuke121/hyut"

            app "hyut.app"
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Casks/hyut.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hyut.rb
          git commit -m "Update hyut to v${VERSION}"
          git push
